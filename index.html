2/3. Бөлім өзгермейді.'}let item={at:new Date().toISOString(),topic:'fraction-addition',answer,steps,error:kind,rule,root,correct:isRight};let data=readLearning();data.attempts.push(item);data.attempts=data.attempts.slice(-200);saveLearning(data);out.innerHTML=`<div class="feedback"><h3>${isRight?'Дұрыс шешім':'Анықталған талдау'}</h3><p><b>Қате түрі:</b> ${kind}</p><p><b>Түсінілмеген болуы мүмкін ереже:</b> ${rule}</p><p><b>Ықтимал түпкі себеп:</b> ${root}</p><p><b>Дұрыс шешу жолы:</b> ${solution}</p><p><b>Түзету тапсырмасы:</b> ${remedial}</p><button class="btn small" onclick="document.querySelector('#detectSteps').value='Алымдарды қосамын: 2+4=6. Бөлім 9 өзгермейді.';document.querySelector('#detectAnswer').value='6/9';detectError()">Түзету тапсырмасын орындау</button></div>`;let ev=document.querySelector('#savedEvidence');if(ev)ev.textContent=`Соңғы әрекет сақталды · ${data.attempts.length} оқу дәлелі бар. Бұл деректер диагностика нәтижелерімен бір профильге тіркеледі.`};

teacherView=function(){let g=teacherClass,topics=gradeTopics[g],d=readLearning(),base=Array.from({length:18+(g%7)},(_,i)=>({name:`Оқушы ${String(i+1).padStart(2,'0')}`,score:48+((g*13+i*17)%49)}));if(g===7&&d.mastery.fractions!==undefined)base[0]={name:'Демо оқушы · Әлихан',score:d.mastery.fractions};let avg=Math.round(base.reduce((a,x)=>a+x.score,0)/base.length),scores=topics.map((t,i)=>({name:t,score:Math.min(98,Math.max(38,avg+((i*13+g*7)%27)-13))})),weak=[...scores].sort((a,b)=>a.score-b.score)[0],status=p=>p>=75?'good':p>=55?'mid':'low';return `${head('Мұғалім кабинеті',`${g}-сынып оқушыларының үлгерімі мен тақырыптық нәтижелері.`)}<div class="notice">Демонстрациялық сынып деректері. Сақталған диагностиканың нәтижесі 7-сынып таңдалғанда демо оқушының көрсеткішіне қосылады.</div><div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><label for="teacherGrade" style="font-weight:700">Сынып</label><select id="teacherGrade" class="input" style="max-width:200px" onchange="teacherClass=Number(this.value);render()">${Array.from({length:9},(_,i)=>`<option value="${i+1}" ${g===i+1?'selected':''}>${i+1}-сынып</option>`).join('')}</select><span class="sub">Сынып таңдалғанда барлық көрсеткіш жаңарады.</span></div><div class="grid stats">${stat('Оқушылар саны',base.length,'♙',`${g}-сынып`)}${stat('Орташа нәтиже',avg+'%','✓','Осы сынып бойынша')}${stat('Қайта қарау қажет',weak.name,'!','Ең төмен нәтиже: '+weak.score+'%')}${stat('Тақырып саны',topics.length,'▦',`${g}-сынып мазмұны`)}</div><div class="grid teachergrid"><div class="card">${cardTitle(`${g}-сынып оқушылары`,`${base.length} оқушы`)}<div style="max-height:440px;overflow:auto"><table class="table"><thead><tr><th>Оқушы</th><th>Нәтиже</th><th>Деңгей</th><th>Ұсыну</th></tr></thead><tbody>${base.map(s=>`<tr><td>${s.name}</td><td>${s.score}%</td><td><span class="badge ${status(s.score)}">${s.score>=75?'Жақсы':s.score>=55?'Қайталау':'Көмек керек'}</span></td><td><button class="btn small secondary" onclick="teacherClass=${g};exerciseGrade=${g};go('practice')">Жаттығу →</button></td></tr>`).join('')}</tbody></table></div></div><div class="card">${cardTitle(`${g}-сынып тақырыптары`,'Орташа сынып нәтижесі '+avg+'%')}${scores.map(s=>`<div class="topic"><div class="topicname">${s.name}</div><div class="track"><div class="fill ${s.score<55?'red':s.score<75?'yellow':''}" style="width:${s.score}%"></div></div><div class="percent">${s.score}%</div></div>`).join('')}<div class="feedback"><b>Сыныпқа ұсыныс:</b> «${weak.name}» тақырыбынан ${weak.score<55?'негізгі ережені қайталап, деңгейлік тапсырма орындау':'қысқаша бекіту жаттығуын орындау'} ұсынылады.</div></div></div>`};
const _taskPractice=practiceView;
practiceView=function(){let html=_taskPractice().replace('id="solveProblem" class="input"','id="solveProblem" class="input" oninput="selectedExercise=null"'),topics=['all',...new Set(exerciseBank.filter(x=>x.g===exerciseGrade).map(x=>x.t))],list=exerciseBank.filter(x=>x.g===exerciseGrade&&(exerciseTopic==='all'||x.t===exerciseTopic));let panel=`<div class="panel card" style="margin-top:16px">${cardTitle('Деңгейлік жаттығулар','18 есеп · 1–9 сынып')}<div class="formrow" style="flex-wrap:wrap"><label class="sub">Сынып <select class="input" style="min-width:130px" onchange="exerciseGrade=Number(this.value);exerciseTopic='all';render()">${Array.from({length:9},(_,i)=>`<option value="${i+1}" ${exerciseGrade===i+1?'selected':''}>${i+1}-сынып</option>`).join('')}</select></label><label class="sub">Тақырып <select class="input" style="min-width:190px" onchange="exerciseTopic=this.value;render()">${topics.map(t=>`<option value="${t}" ${exerciseTopic===t?'selected':''}>${t==='all'?'Барлық тақырып':t}</option>`).join('')}</select></label></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px">${list.map((x,i)=>`<article class="maptile"><span class="badge mid">${x.g}-сынып · ${x.t}</span><h4 style="margin-top:12px">${x.title}</h4><div class="sub" style="min-height:38px">${x.prompt}</div><button class="btn small" style="margin-top:12px" onclick="chooseExercise(${exerciseBank.indexOf(x)})">Есепті шығару →</button></article>`).join('')}</div></div>`;return html+panel};
chooseExercise=function(i){selectedExercise=exerciseBank[i];exerciseGrade=selectedExercise.g;document.querySelector('#solveProblem').value=selectedExercise.prompt;document.querySelector('#solveSteps').value='';document.querySelector('#solveAnswer').value='';document.querySelector('#solveOutput').innerHTML='';document.querySelector('#solveProblem').scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#solveAnswer').focus()};
const _solveTask=solveTask;
solveTask=function(){if(!selectedExercise){_solveTask();return}let t=sc(),problem=document.querySelector('#solveProblem').value.trim(),steps=document.querySelector('#solveSteps').value.trim(),answer=document.querySelector('#solveAnswer').value.trim().replaceAll(' ',''),out=document.querySelector('#solveOutput'),button=document.querySelector('#solveButton');if(!problem){toast(t.need);return}button.disabled=true;button.textContent=t.working;out.innerHTML=`<div class="solving"><span class="spinner"></span>${t.working}</div>`;setTimeout(()=>{let ok=answer===selectedExercise.answer,data=readLearning();data.attempts.push({at:new Date().toISOString(),topic:selectedExercise.t,grade:selectedExercise.g,problem,answer,steps,correct:ok,error:ok?'':'Жауап сәйкес келмеді',rule:selectedExercise.rule});data.attempts=data.attempts.slice(-200);saveLearning(data);button.disabled=false;button.textContent=t.solve+'　→';out.innerHTML=`<div class="feedback"><h3>${t.result}</h3><p><b>${ok?t.correct:t.mistake}:</b> ${ok?'Дұрыс жауап.':`Енгізілген жауап: ${answer||'—'}. Дұрыс жауап: ${selectedExercise.answer}.`}</p><p><b>${t.explanation}:</b> ${selectedExercise.solution}</p><p><b>Қолданылатын ереже:</b> ${selectedExercise.rule}</p>${steps?`<p><b>Сенің шешу қадамдарың:</b> ${steps}</p>`:''}<div class="solve-formula"></div><small>${t.demo}</small></div>`;let f=out.querySelector('.solve-formula');if(window.katex&&f)katex.render(selectedExercise.tex,f,{displayMode:true,throwOnError:false})},650)};
if(page==='teacher'||page==='practice')render();
</script></body></html>
